<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apni Mehfil - Sab Ka Adda</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#fff;font-family:Arial,sans-serif;padding-bottom:80px}
.top{background:#1a1a1a;padding:12px;text-align:center;position:sticky;top:0;z-index:10;border-bottom:2px solid #FFD700}
.top h1{margin:0;color:#FFD700;font-size:22px}
.card{background:#1e1e1e;margin:10px;border-radius:15px;padding:12px;border:1px solid #333}
input,textarea,select{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:none;background:#2a2a2a;color:#fff;outline:none}
button{padding:10px 14px;border:none;border-radius:10px;cursor:pointer;font-weight:bold}
.btnGold{background:#FFD700;color:#000;width:100%;margin-top:6px}
.btnBlack{background:#333;color:#fff}
.dpBig{width:80px;height:80px;border-radius:50%;background:#FFD700;color:#000;display:flex;align-items:center;justify-content:center;font-size:35px;margin:auto;overflow:hidden}
.dpBig img{width:100%;height:100%;object-fit:cover}
.post img{width:100%;border-radius:12px;margin-top:8px;max-height:400px;object-fit:cover}
.pBtns{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.pBtns button{flex:1;background:#2a2a2a;color:#fff;font-size:12px;padding:9px 4px}
.pBtns button.gold{background:#FFD700;color:#000}
.onlineRow{display:flex;gap:10px;overflow-x:auto;padding:5px}
.uCircle{min-width:70px;text-align:center;background:#2a2a2a;padding:8px;border-radius:12px;cursor:pointer}
.uCircle div{width:50px;height:50px;border-radius:50%;background:#FFD700;color:#000;display:flex;align-items:center;justify-content:center;font-size:22px;margin:auto;position:relative;overflow:hidden}
.uCircle div img{width:100%;height:100%;object-fit:cover}
.dot{width:11px;height:11px;background:#00ff00;border-radius:50%;position:absolute;bottom:2px;right:2px;border:2px solid #000}
.small{font-size:12px;color:#aaa}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1a1a1a;display:flex;border-top:2px solid #FFD700}
.nav button{flex:1;background:none;color:#fff;padding:14px 2px;font-size:12px}
.nav button.active{color:#FFD700}
.hidden{display:none}
.toggleBox{display:flex;align-items:center;justify-content:space-between;background:#2a2a2a;padding:10px;border-radius:10px;margin:8px 0}
.switch{position:relative;width:50px;height:26px;background:#555;border-radius:20px;cursor:pointer}
.switch.on{background:#00c853}
.switch:after{content:'';position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s}
.switch.on:after{left:26px}
</style>
</head>
<body>

<div class="top"><h1>⭐ Apni Mehfil ⭐</h1><div id="welcomeMsg" class="small"></div></div>

<!-- LOGIN / SIGNUP -->
<div id="authPage" class="card">
<h2 style="text-align:center">Welcome Jani ❤️</h2>
<input id="authName" placeholder="Apna Naam Likho">
<input id="authPass" type="password" placeholder="Password">
<button class="btnGold" onclick="doSignup()">Sign Up Karo</button>
<button class="btnBlack" style="width:100%;margin-top:6px" onclick="doLogin()">Login Karo</button>
<p class="small" style="text-align:center">Ek bar signup karo, phir hamesha login hoga.</p>
</div>

<!-- HOME -->
<div id="homePage" class="hidden">
<div class="card">
<div style="display:flex;justify-content:space-between"><b>🟢 Online Users - <span id="onlineCount">0</span></b><span class="small" onclick="showPage('profile')" style="cursor:pointer">⚙️ Setting</span></div>
<div id="onlineBar" class="onlineRow"></div>
</div>

<div class="card">
<textarea id="postText" placeholder="Kuch dil ki baat likho..."></textarea>
<input type="file" id="postPic" accept="image/*">
<button class="btnGold" onclick="doPost()">📝 Post Karo</button>
</div>
<div id="feed"></div>
</div>

<!-- PROFILE / SETTING -->
<div id="profilePage" class="hidden">
<div class="card" style="text-align:center">
<div class="dpBig" id="myDp">👤</div>
<h2 id="myName">-</h2>
<p id="myBioText" class="small"></p>
<p>⭐ Points: <span id="myPoints">0</span></p>
</div>
<div class="card">
<h3>⚙️ Privacy Setting</h3>
<div class="toggleBox"><span>👁️ Last Seen Dikhaye?<br><small>OFF karo ge to kisi ko nazar nahi aaye ga</small></span><div id="lastSeenSwitch" class="switch on" onclick="toggleLastSeen()"></div></div>
<input id="bioInput" placeholder="Apni Bio Likho">
<button class="btnGold" onclick="saveBio()">Bio Save Karo</button>
<button class="btnBlack" style="width:100%;margin-top:8px" onclick="doLogout()">Logout</button>
</div>
</div>

<div class="nav">
<button id="navHome" class="active" onclick="showPage('home')">🏠 Home</button>
<button onclick="showPage('profile')">👤 Profile</button>
</div>

<script>
// ===== DATA - LocalStorage me save, sab kuch yahin rehta hai =====
var cur = localStorage.getItem('mehfil_cur') || '';
function getUsers(){ try{return JSON.parse(localStorage.getItem('mehfil_users')||'{}')}catch(e){return {}} }
function saveUsers(u){ localStorage.setItem('mehfil_users', JSON.stringify(u)) }
function getPosts(){ try{return JSON.parse(localStorage.getItem('mehfil_posts')||'[]')}catch(e){return []} }
function savePosts(p){ localStorage.setItem('mehfil_posts', JSON.stringify(p)) }

function emojify(t){ return (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;') }
function timeAgo(t){
  if(!t) return 'Kabhi nahi aya';
  var d = Date.now()-t;
  if(d<60000) return 'Abhi abhi Online';
  if(d<3600000) return Math.floor(d/60000)+' min pehle';
  if(d<86400000) return Math.floor(d/3600000)+' ghante pehle';
  return Math.floor(d/86400000)+' din pehle';
}

// ===== SOUNDS - Pha + Chapair =====
function playPha(){
  try{
    var a=new (window.AudioContext||window.webkitAudioContext)();
    var o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination); o.type='sine';
    o.frequency.setValueAtTime(600,a.currentTime);
    o.frequency.exponentialRampToValueAtTime(1600,a.currentTime+0.08);
    o.frequency.exponentialRampToValueAtTime(400,a.currentTime+0.18);
    g.gain.setValueAtTime(0.5,a.currentTime); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+0.25);
    o.start(); o.stop(a.currentTime+0.26);
    if(navigator.vibrate) navigator.vibrate(40);
  }catch(e){}
}
function playChapair(){
  try{
    var a=new (window.AudioContext||window.webkitAudioContext)();
    var len=a.sampleRate*0.2; var buf=a.createBuffer(1,len,a.sampleRate); var d=buf.getChannelData(0);
    for(var i=0;i<len;i++){ d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2); }
    var s=a.createBufferSource(); s.buffer=buf; var g=a.createGain();
    g.gain.setValueAtTime(1,a.currentTime); g.gain.exponentialRampToValueAtTime(0.01,a.currentTime+0.2);
    s.connect(g); g.connect(a.destination); s.start();
    if(navigator.vibrate) navigator.vibrate([60,30,60]);
  }catch(e){}
}

function showPage(p){
  document.getElementById('homePage').classList.toggle('hidden', p!=='home');
  document.getElementById('profilePage').classList.toggle('hidden', p!=='profile');
  document.getElementById('authPage').classList.toggle('hidden', !!cur);
  document.getElementById('navHome').classList.toggle('active', p==='home');
  if(p==='home') loadAll();
  if(p==='profile') loadProfile();
}
function updateLastSeen(){
  if(!cur) return;
  var u=getUsers(); if(u[cur]){ u[cur].lastSeen=Date.now(); saveUsers(u); }
}
setInterval(updateLastSeen, 30000);

function doSignup(){
  var n=document.getElementById('authName').value.trim();
  var p=document.getElementById('authPass').value.trim();
  if(!n||!p){ alert('Naam aur Password likho jani'); return; }
  var u=getUsers();
  if(u[n]){ alert('Ye naam pehle se hai, Login karo'); return; }
  u[n]={u:n,pass:p,points:20,dp:'👤',bio:'',lastSeen:Date.now(),showLastSeen:true,created:Date.now()};
  saveUsers(u); cur=n; localStorage.setItem('mehfil_cur',cur);
  alert('Ho gaya jani! Welcome ❤️ +20 Points mile');
  showPage('home');
}
function doLogin(){
  var n=document.getElementById('authName').value.trim();
  var p=document.getElementById('authPass').value.trim();
  var u=getUsers();
  if(!u[n]||u[n].pass!==p){ alert('Naam ya Password ghalat hai'); return; }
  cur=n; localStorage.setItem('mehfil_cur',cur); updateLastSeen();
  showPage('home');
}
function doLogout(){ cur=''; localStorage.removeItem('mehfil_cur'); showPage('home'); location.reload(); }

function toggleLastSeen(){
  var u=getUsers(); if(!u[cur]) return;
  u[cur].showLastSeen = !u[cur].showLastSeen;
  saveUsers(u); loadProfile(); loadAll();
  alert(u[cur].showLastSeen ? 'Last Seen ON ho gaya ✅' : 'Last Seen OFF ho gaya 🔒 Ab kisi ko nazar nahi aaye ga');
}
function saveBio(){
  var u=getUsers(); u[cur].bio=document.getElementById('bioInput').value; saveUsers(u); alert('Bio save ho gayi'); loadProfile();
}
function loadProfile(){
  var u=getUsers()[cur]; if(!u) return;
  document.getElementById('myName').innerText=u.u;
  document.getElementById('myBioText').innerText=u.bio||'';
  document.getElementById('myPoints').innerText=u.points||0;
  document.getElementById('myDp').innerHTML = (u.dp && u.dp.length>10) ? '<img src="'+u.dp+'">' : (u.dp||'👤');
  document.getElementById('lastSeenSwitch').className = 'switch '+(u.showLastSeen!==false?'on':'');
  document.getElementById('bioInput').value=u.bio||'';
  document.getElementById('welcomeMsg').innerText='Salam '+cur+' ⭐ '+ (u.points||0)+' Points';
}

function doPost(){
  var t=document.getElementById('postText').value.trim();
  var f=document.getElementById('postPic').files[0];
  if(!t && !f){ alert('Kuch likho ya pic lagao'); return; }
  function saveIt(pic){
    var posts=getPosts();
    posts.unshift({id:Date.now()+''+Math.random(),u:cur,text:t,pic:pic||'',likes:0,likedBy:[],comments:[],time:Date.now()});
    savePosts(posts);
    var u=getUsers(); u[cur].points=(u[cur].points||0)+10; saveUsers(u);
    document.getElementById('postText').value=''; document.getElementById('postPic').value='';
    loadAll(); alert('Post ho gayi +10 Points ⭐');
  }
  if(f){ var r=new FileReader(); r.onload=function(e){ saveIt(e.target.result) }; r.readAsDataURL(f); } else saveIt('');
}

function doLike(id){
  playPha();
  var posts=getPosts(); var p=posts.find(x=>x.id==id); if(!p) return;
  if(p.likedBy && p.likedBy.includes(cur)){ alert('Pehle se Pha kar diya hai 😂'); return; }
  p.likes=(p.likes||0)+1; p.likedBy=p.likedBy||[]; p.likedBy.push(cur);
  savePosts(posts);
  var u=getUsers(); if(u[p.u]){ u[p.u].points=(u[p.u].points||0)+2; saveUsers(u); }
  loadAll();
}
function doChapairPost(id){
  playChapair();
  var posts=getPosts(); var p=posts.find(x=>x.id==id); if(!p) return;
  alert('👋 '+p.u+' ko Chapair maar di! 😂');
  var u=getUsers(); u[cur].points=(u[cur].points||0)+2; saveUsers(u); loadAll();
}
function doComment(id){
  var c=prompt('Comment likho jani:');
  if(!c) return;
  var posts=getPosts(); var p=posts.find(x=>x.id==id); p.comments=p.comments||[]; p.comments.push({u:cur,text:c,time:Date.now()}); savePosts(posts); loadAll();
}
function doShare(id){
  var posts=getPosts(); var p=posts.find(x=>x.id==id);
  var txt=p.u+' ne likha: '+(p.text||'');
  if(navigator.share){ navigator.share({title:'Apni Mehfil',text:txt}); }
  else { navigator.clipboard.writeText(txt); alert('Copy ho gaya, ab kisi ko bhi bhej do ↗️'); }
}
function doRepost(id){
  var posts=getPosts(); var p=posts.find(x=>x.id==id);
  posts.unshift({id:Date.now()+''+Math.random(),u:cur,text:'🔁 Repost - '+p.u+' ki post: '+(p.text||''),pic:p.pic||'',likes:0,likedBy:[],comments:[],time:Date.now()});
  savePosts(posts); loadAll(); alert('Repost ho gaya 🔁');
}

function openUserProfile(name){
  var u=getUsers()[name]; if(!u){ alert('User nahi mila'); return; }
  var isOnline=(Date.now()-(u.lastSeen||0))<5*60*1000;
  var lastText='';
  if(u.showLastSeen===false){ lastText='🔒 Last Seen Chupaya Hua Hai'; }
  else { lastText = isOnline ? '🟢 Online Hai' : '⚪ '+timeAgo(u.lastSeen); }
  var posts=getPosts().filter(x=>x.u===name);
  var html='<div class="card" style="text-align:center;border:2px solid #FFD700"><div class="dpBig">'+((u.dp&&u.dp.length>10)?'<img src="'+u.dp+'">':(u.dp||'👤'))+'</div><h2>'+u.u+'</h2><p>'+lastText+'</p><p class="small">'+emojify(u.bio||'')+'</p><p>⭐ '+(u.points||0)+' | 📝 '+posts.length+' posts</p><button class="btnBlack" onclick="loadAll()">⬅️ Back</button></div>';
  document.getElementById('feed').innerHTML=html; window.scrollTo(0,0);
}

function loadAll(){
  if(!cur){ showPage('home'); return; }
  document.getElementById('authPage').classList.add('hidden');
  document.getElementById('homePage').classList.remove('hidden');
  loadProfile();
  var users=getUsers(); var now=Date.now();
  var arr=Object.values(users).sort((a,b)=>(b.points||0)-(a.points||0));
  document.getElementById('onlineCount').innerText=arr.filter(u=>(now-(u.lastSeen||0))<5*60*1000).length;
  document.getElementById('onlineBar').innerHTML=arr.map(u=>{
    var isOnline=(now-(u.lastSeen||0))<5*60*1000;
    var dp=(u.dp&&u.dp.length>10)?'<img src="'+u.dp+'">':(u.dp||'👤');
    var last='';
    if(u.showLastSeen===false){ last='<span class="small">🔒 Hidden</span>'; }
    else { last = isOnline ? '<span style="color:#00ff00;font-size:10px">● Online</span>' : '<span class="small">'+timeAgo(u.lastSeen)+'</span>'; }
    return '<div class="uCircle" onclick="openUserProfile(\''+u.u+'\')"><div>'+dp+(isOnline?'<span class="dot"></span>':'')+'</div><p style="margin:4px 0 0">'+u.u+'</p><small>⭐ '+(u.points||0)+'</small><br>'+last+'</div>';
  }).join('') || '<p class="small">Koi nahi</p>';

  var posts=getPosts();
  document.getElementById('feed').innerHTML = posts.map(p=>{
    var comments=(p.comments||[]).map(c=>'<div style="background:#2a2a2a;padding:8px;border-radius:8px;margin-top:5px"><b>'+c.u+':</b> '+emojify(c.text)+'</div>').join('');
    return '<div class="card post"><b>'+p.u+'</b> <span class="small">'+timeAgo(p.time)+'</span><p>'+emojify(p.text)+'</p>'+(p.pic?'<img src="'+p.pic+'">':'')+
    '<div class="pBtns"><button class="gold" onclick="doLike(\''+p.id+'\')">👍 Pha '+(p.likes||0)+'</button><button onclick="doChapairPost(\''+p.id+'\')">👋 Chapair</button><button onclick="doComment(\''+p.id+'\')">💬 Comment '+(p.comments?p.comments.length:0)+'</button><button onclick="doShare(\''+p.id+'\')">↗️ Share</button><button onclick="doRepost(\''+p.id+'\')">🔁 Repost</button></div>'+comments+'</div>';
  }).join('') || '<div class="card"><p style="text-align:center">Abhi koi post nahi, pehli post tum karo ❤️</p></div>';
}

// Start
if(cur){ showPage('home'); } else { document.getElementById('authPage').classList.remove('hidden'); document.getElementById('homePage').classList.add('hidden'); }
</script>
</body>
</html>
