<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YAARII-PK</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;padding-bottom:90px}
header{background:#000;padding:12px;text-align:center;border-bottom:2px solid #d4af37}
header h1{margin:0;color:#ffd700}
.card{background:#111;border:1px solid #333;border-radius:14px;padding:12px;margin:9px auto;max-width:520px}
input{width:100%;padding:11px;margin:6px 0;border-radius:11px;border:none;background:#222;color:#fff;box-sizing:border-box}
button{padding:11px 14px;border:none;border-radius:20px;background:#ffd700;color:#000;font-weight:700;cursor:pointer;margin:3px}
button.g{background:#222;color:#ffd700;border:1px solid #ffd700}
.hid{display:none}
.sm{color:#aaa;font-size:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:2px solid #d4af37;display:flex;padding:8px;z-index:30}
.bottom div{flex:1;text-align:center;color:#ffd700;cursor:pointer}
.pf{width:70px;height:70px;border-radius:50%;object-fit:cover;border:2px solid #ffd700;background:#222}
.st{width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid #ffd700}
video{width:100%;border-radius:12px}
</style>
</head>
<body>
<header><h1>YAARII-PK 👑</h1><p>Apni Mehfil - Apni Yaari - Sab Online</p></header>

<div id="auth">
<div class="card" style="text-align:center">
<h2 style="color:#ffd700">Account Banao</h2>
<input id="un" placeholder="Naam - jaise Leader NM">
<input id="pw" type="password" placeholder="Password">
<label><input type="checkbox" id="ag" style="width:auto"> Rules se agree hun</label><br>
<button onclick="signup()" style="width:100%">Signup</button>
<button class="g" onclick="login()" style="width:100%">Login</button>
<p id="am" style="color:#ff6666"></p>
<p class="sm" id="conn">Firebase se connect ho raha hai...</p>
</div>
</div>

<div id="main" class="hid">
<div class="card" style="text-align:center">
<img id="myp" class="pf" src=""><br>
<b id="mn"></b> <span id="mid" class="sm"></span><br>
<span class="sm">Points: <b id="mpt" style="color:#ffd700">0</b></span><br>
<span id="mbio" class="sm"></span><br>
<input id="bio" placeholder="Apni Bio likho...">
<br><label class="sm">Profile Pic Lagao</label>
<input type="file" id="ppf" accept="image/*,video/*">
<br><button onclick="upd()">Profile Save</button>
<button class="g" onclick="logout()">Logout</button>
</div>

<div class="card">
<b>STORIES - Sab ki</b><br>
<label class="sm">Story Lagao - Pic ya Video</label>
<input type="file" id="sf" accept="image/*,video/*">
<div id="sl" style="display:flex;gap:8px;overflow:auto;margin-top:8px"></div>
</div>

<div class="card">
<input id="pt" placeholder="Kuch likho... Shayari, Masti, Gossip">
<label class="sm">Post ke saath Pic / Video</label>
<input type="file" id="pf2" accept="image/*,video/*">
<div id="pvWrap"></div>
<br><button onclick="addPost()" style="width:100%">Post Karo +10 Points</button>
</div>
<div id="posts" style="max-width:520px;margin:auto"></div>
</div>

<div class="bottom">
<div onclick="goHome()">HOME</div>
<div onclick="focusP()">SHARE</div>
<div onclick="showLB()">TOP 10</div>
<div onclick="logout()">LOGOUT</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, push, get, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDK8_8TXQE5IJ6dVfm3_yFd99IpxbfidRk",
  authDomain: "yaari-pk.firebaseapp.com",
  databaseURL: "https://yaari-pk-default-rtdb.firebaseio.com",
  projectId: "yaari-pk",
  storageBucket: "yaari-pk.firebasestorage.app",
  messagingSenderId: "1043598133610",
  appId: "1:1043598133610:web:c5e2b5953d76d2601dbd13",
  measurementId: "G-8HLV166GGR"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let U=null, P=null, tmpPic="", tmpIsVideo=false, allUsers={};

function isVideo(data){ return data && data.startsWith("data:video"); }
function mediaHtml(data){
  if(!data) return "";
  if(isVideo(data)) return '<video controls src="'+data+'"></video>';
  return '<img src="'+data+'" style="width:100%;border-radius:12px">';
}
function storyMediaHtml(data){
  if(isVideo(data)) return '<video class="st" src="'+data+'" muted></video>';
  return '<img class="st" src="'+data+'">';
}

window.signup = async function(){
  let u=document.getElementById("un").value.trim();
  let p=document.getElementById("pw").value.trim();
  if(!u||!p){document.getElementById("am").innerText="Naam aur Password likho";return;}
  if(!document.getElementById("ag").checked){document.getElementById("am").innerText="Rules se agree karo";return;}
  let snap=await get(ref(db,"users/"+u));
  if(snap.exists()){document.getElementById("am").innerText="Ye naam pehle se hai, Login karo";return;}
  let user={username:u,password:p,bio:"",pic:"",points:50,id:Math.floor(10000+Math.random()*89999)};
  await set(ref(db,"users/"+u),user);
  U=u; P=user; localStorage.setItem("y_login",u); showMain();
};
window.login = async function(){
  let u=document.getElementById("un").value.trim();
  let p=document.getElementById("pw").value.trim();
  let snap=await get(ref(db,"users/"+u));
  if(!snap.exists()){document.getElementById("am").innerText="Account nahi mila, Signup karo";return;}
  let user=snap.val();
  if(user.password!==p){document.getElementById("am").innerText="Password galat hai";return;}
  U=u; P=user; localStorage.setItem("y_login",u); showMain();
};
window.logout=function(){localStorage.removeItem("y_login");location.reload();};
function showMain(){
  document.getElementById("auth").classList.add("hid");
  document.getElementById("main").classList.remove("hid");
  document.getElementById("mn").innerText=P.username;
  document.getElementById("mid").innerText="("+P.id+")";
  document.getElementById("mpt").innerText=P.points;
  document.getElementById("mbio").innerText=P.bio||"";
  if(P.pic) document.getElementById("myp").src=P.pic;
  listenAll();
}
window.upd=async function(){
  let bio=document.getElementById("bio").value;
  await update(ref(db,"users/"+U),{bio:bio});
  alert("Profile save ho gaya!"); location.reload();
};
window.addPost=async function(){
  let t=document.getElementById("pt").value.trim();
  if(!t && !tmpPic){alert("Kuch likho ya pic/video lagao");return;}
  await push(ref(db,"posts"),{text:t,media:tmpPic,username:U,likes:0,dis:0,time:Date.now()});
  await update(ref(db,"users/"+U),{points:P.points+10});
  P.points=P.points+10; document.getElementById("mpt").innerText=P.points;
  tmpPic=""; document.getElementById("pt").value=""; document.getElementById("pvWrap").innerHTML="";
};
window.like=async function(id,likes){ await update(ref(db,"posts/"+id),{likes:likes+1}); };
window.dislike=async function(id,dis){ await update(ref(db,"posts/"+id),{dis:dis+1}); alert("DISLIKE! Banda naraz ho gaya!"); };
window.slap=function(name){ alert("CHUPAIR! "+name+" ko zor ka chupair para! PAAAK!"); };
window.sharePost=function(txt){ if(navigator.share){navigator.share({text:txt});} else {alert(txt);} };
window.showLB=function(){
  let arr=Object.values(allUsers); arr.sort((a,b)=>b.points-a.points);
  let s="TOP 10 LEADERBOARD\n\n";
  for(let i=0;i<arr.length&&i<10;i++){ s=s+(i+1)+". "+arr[i].username+" - "+arr[i].points+" pts\n"; }
  alert(s);
};
window.goHome=function(){window.scrollTo(0,0);};
window.focusP=function(){document.getElementById("pt").focus();window.scrollTo(0,400);};

function listenAll(){
  onValue(ref(db,"users"),(snap)=>{ allUsers=snap.val()||{}; });
  onValue(ref(db,"posts"),(snap)=>{
    let data=snap.val()||{};
    let keys=Object.keys(data); keys.sort((a,b)=>data[b].time-data[a].time);
    let h="";
    for(let id of keys){
      let p=data[id];
      h+='<div class="card"><b>'+p.username+'</b><p>'+p.text+'</p>'+mediaHtml(p.media)+'<br><button onclick="like(\''+id+'\','+(p.likes||0)+')">REACT '+(p.likes||0)+'</button><button class="g" onclick="dislike(\''+id+'\','+(p.dis||0)+')">DISLIKE '+(p.dis||0)+'</button><button class="g" onclick="slap(\''+p.username+'\')">CHUPAIR</button><button class="g" onclick="sharePost(\''+p.username+' ne YAARII-PK pe post kiya\')">SHARE</button></div>';
    }
    document.getElementById("posts").innerHTML=h||"<div class='card'>Abhi koi post nahi</div>";
  });
  onValue(ref(db,"stories"),(snap)=>{
    let data=snap.val()||{};
    let keys=Object.keys(data); keys.reverse();
    let h="";
    for(let id of keys){ let s=data[id]; h+='<div style="text-align:center">'+storyMediaHtml(s.media)+'<br><span class="sm">'+s.user+'</span></div>'; }
    document.getElementById("sl").innerHTML=h||"<span class='sm'>Abhi koi story nahi</span>";
  });
  document.getElementById("conn").innerText="Firebase Connected ✅ - Sab Online Dikhega";
}

document.getElementById("ppf").addEventListener("change",function(e){
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader(); r.onload=async function(ev){
    await update(ref(db,"users/"+U),{pic:ev.target.result});
    document.getElementById("myp").src=ev.target.result; alert("Profile Pic lag gayi!");
  }; r.readAsDataURL(f);
});
document.getElementById("pf2").addEventListener("change",function(e){
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader(); r.onload=function(ev){ tmpPic=ev.target.result; document.getElementById("pvWrap").innerHTML=mediaHtml(tmpPic); }; r.readAsDataURL(f);
});
document.getElementById("sf").addEventListener("change",function(e){
  let f=e.target.files[0]; if(!f) return;
  let r=new FileReader(); r.onload=async function(ev){ await push(ref(db,"stories"),{media:ev.target.result,user:U,time:Date.now()}); alert("Story lag gayi! Sab ko dikhegi"); }; r.readAsDataURL(f);
});

// Auto Login
let sv=localStorage.getItem("y_login");
if(sv){
  get(ref(db,"users/"+sv)).then(snap=>{ if(snap.exists()){ U=sv; P=snap.val(); showMain(); } else { document.getElementById("conn").innerText="Firebase Connected ✅"; } });
} else {
  document.getElementById("conn").innerText="Firebase Connected ✅";
}
</script>
</body>
</html>
