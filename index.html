<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaarii-PK - Apni Mehfil</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial}
header{background:#111;border-bottom:2px solid #d4af37;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;color:#d4af37;font-size:28px;letter-spacing:2px}
header p{margin:2px;color:#aaa;font-size:13px}
nav{display:flex;gap:5px;padding:10px;background:#111;overflow-x:auto}
nav button{background:#1a1a1a;color:#d4af37;border:1px solid #d4af37;padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}
nav button.active{background:#d4af37;color:#000}
.container{max-width:600px;margin:auto;padding:12px}
.card{background:#111;border:1px solid #333;border-radius:14px;padding:14px;margin-bottom:14px}
input,textarea,select{width:100%;background:#000;color:#fff;border:1px solid #444;padding:11px;border-radius:10px;margin-top:8px}
button.main{background:#d4af37;color:#000;border:none;padding:11px;border-radius:10px;font-weight:bold;cursor:pointer;width:100%;margin-top:8px}
.small{font-size:12px;color:#aaa}
.post-img{width:100%;border-radius:10px;margin-top:10px;max-height:400px;object-fit:cover}
.badge{color:#d4af37;font-weight:bold}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid #d4af37}
.flex{display:flex;gap:10px;align-items:center}
.like{cursor:pointer;color:#d4af37}
.hidden{display:none}
.pass-wrap{position:relative}
.eye{position:absolute;right:10px;top:18px;cursor:pointer;font-size:20px}
</style>
</head>
<body>
<header>
<h1>👑 YAARII-PK</h1>
<p>Apni Mehfil - Apni Yaari</p>
</header>
<nav>
<button onclick="filterTopic('All')" class="active">All</button>
<button onclick="filterTopic('Poetry')">Poetry</button>
<button onclick="filterTopic('Jokes')">Funny Jokes</button>
<button onclick="filterTopic('Sad')">Sad Poetry</button>
<button onclick="filterTopic('Mehfil')">Mehfil</button>
<button onclick="showProfile()">My Profile</button>
</nav>
<div class="container">
<div class="card" id="authCard">
<h3 style="color:#d4af37;margin:0">Login / Signup</h3>
<input id="username" placeholder="Username likho - jaise Leader NM">
<div class="pass-wrap">
<input id="password" type="password" placeholder="Password likho">
<span class="eye" onclick="togglePass()">👁️</span>
</div>
<button class="main" onclick="signup()">Signup Karo</button>
<button class="main" style="background:#222;color:#d4af37;border:1px solid #d4af37" onclick="login()">Login Karo</button>
<button class="main" style="background:#222;color:#fff" onclick="logout()">Logout</button>
<p class="small" id="authMsg"></p>
</div>
<div class="card hidden" id="profileCard">
<h3 style="color:#d4af37;margin:0">Profile Update</h3>
<div class="flex"><img id="myPic" class="avatar" src="https://via.placeholder.com/100"><div><b id="myName">Guest</b><br><span class="small" id="myBioShow"></span></div></div>
<input id="bio" placeholder="Bio likho...">
<input id="picUrl" placeholder="Profile Pic Link">
<button class="main" onclick="updateProfile()">Profile Save Karo</button>
</div>
<div class="card">
<h3 style="color:#d4af37;margin:0">✍️ Nayi Post</h3>
<select id="topic"><option>Poetry</option><option>Funny Jokes</option><option>Sad Poetry</option><option>Mehfil</option></select>
<textarea id="postText" placeholder="Apni poetry / joke likho..."></textarea>
<input id="postImg" placeholder="Pic ka Link (optional)">
<button class="main" onclick="addPost()">Post Karo</button>
</div>
<div id="posts"></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, doc, setDoc, getDoc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDK8_8TXQE5IJ6dVfm3_yFd99IpxbfidRk",
  authDomain: "yaari-pk.firebaseapp.com",
  databaseURL: "https://yaari-pk-default-rtdb.firebaseio.com",
  projectId: "yaari-pk",
  storageBucket: "yaari-pk.firebasestorage.app",
  messagingSenderId: "1043598133610",
  appId: "1:1043598133610:web:c5e2b5953d76d2601dbd13",
  measurementId: "G-8HLV166GGR"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
let currentUser=null, currentProfile=null, currentFilter='All';

window.togglePass = ()=>{
  let p = document.getElementById('password');
  p.type = p.type==='password' ? 'text' : 'password';
}

// USERNAME + PASSWORD SYSTEM - NO EMAIL
window.signup = async()=>{
  let u = username.value.trim();
  let p = password.value.trim();
  if(!u || !p) return authMsg.innerText="Username aur Password dono likho";
  if(p.length < 4) return authMsg.innerText="Password kam se kam 4 ka rakho";
  let id = u.toLowerCase().replace(/\s+/g,'_');
  let snap = await getDoc(doc(db,"users",id));
  if(snap.exists()) return authMsg.innerText="Ye username pehle se hai, koi aur rakho";
  let isAdmin = (u === "Leader NM");
  await setDoc(doc(db,"users",id),{username:u, password:p, bio:"", pic:"", isAdmin:isAdmin});
  localStorage.setItem("yaarii_user", id);
  currentProfile={username:u, password:p, bio:"", pic:"", isAdmin:isAdmin};
  currentUser=id;
  showLoggedIn();
  authMsg.innerText="Signup ho gaya! Welcome "+u;
}
window.login = async()=>{
  let u = username.value.trim();
  let p = password.value.trim();
  if(!u || !p) return authMsg.innerText="Username aur Password likho";
  let id = u.toLowerCase().replace(/\s+/g,'_');
  let snap = await getDoc(doc(db,"users",id));
  if(!snap.exists()) return authMsg.innerText="Ye account nahi mila, pehle Signup karo";
  let data = snap.data();
  if(data.password !== p) return authMsg.innerText="Password galat hai";
  localStorage.setItem("yaarii_user", id);
  currentUser=id; currentProfile=data;
  showLoggedIn();
  authMsg.innerText="Welcome back "+data.username+"!";
}
window.logout = ()=>{ localStorage.removeItem("yaarii_user"); location.reload(); }

function showLoggedIn(){
  profileCard.classList.remove('hidden');
  myName.innerHTML = currentProfile.username + (currentProfile.isAdmin ? ' 👑 <span class=badge>LEADER</span>' : '');
  myBioShow.innerText = currentProfile.bio||"";
  if(currentProfile.pic) myPic.src=currentProfile.pic;
  loadPosts();
}
window.updateProfile = async()=>{
  if(!currentUser) return alert("Pehle login karo");
  await updateDoc(doc(db,"users",currentUser),{bio:bio.value, pic:picUrl.value});
  alert("Profile update ho gaya!"); location.reload();
}
window.addPost = async()=>{
  if(!currentUser) return alert("Pehle login karo jani");
  if(!postText.value) return alert("Kuch likho to sahi");
  await addDoc(collection(db,"posts"),{text:postText.value, img:postImg.value, topic:topic.value, uid:currentUser, username:currentProfile?.username||"User", pic:currentProfile?.pic||"", isAdmin:currentProfile?.isAdmin||false, likes:0, time:serverTimestamp()});
  postText.value=""; postImg.value=""; loadPosts();
}
window.filterTopic = (t)=>{ currentFilter=t; document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active')); event.target.classList.add('active'); loadPosts(); }
window.showProfile = ()=>{ profileCard.classList.remove('hidden'); window.scrollTo(0,0); }
window.likePost = async(id,likes)=>{ await updateDoc(doc(db,"posts",id),{likes:likes+1}); loadPosts(); }
window.deletePost = async(id)=>{
  if(!currentProfile?.isAdmin) return alert("Sirf Admin delete kar sakta hai");
  if(confirm("Delete kar dun?")){ await deleteDoc(doc(db,"posts",id)); loadPosts(); }
}
async function loadPosts(){
  try{
    const q = query(collection(db,"posts"), orderBy("time","desc"));
    const snap = await getDocs(q);
    let html="";
    snap.forEach(d=>{
      const p=d.data();
      if(currentFilter!=='All' && !p.topic.includes(currentFilter) && p.topic!==currentFilter) return;
      const crown = p.isAdmin ? ' 👑 <span class=badge>LEADER • ADMIN</span>' : '';
      const delBtn = currentProfile?.isAdmin ? `<button onclick="deletePost('${d.id}')" style="background:red;color:#fff;border:none;padding:5px 10px;border-radius:8px;margin-top:8px">Delete (Admin)</button>` : '';
      html+=`<div class="card"><div class="flex"><img class="avatar" src="${p.pic||'https://via.placeholder.com/100'}"><div><b>${p.username}</b>${crown}<br><span class="small">${p.topic}</span></div></div><p>${p.text}</p>${p.img?`<img class="post-img" src="${p.img}">`:''}<div style="margin-top:10px"><span class="like" onclick="likePost('${d.id}',${p.likes||0})">❤️ ${p.likes||0} Like</span> &nbsp; 💬 Comment</div>${delBtn}</div>`;
    });
    posts.innerHTML = html || "<p style='text-align:center;color:#888'>Abhi koi post nahi, pehli post tum karo!</p>";
  }catch(e){ posts.innerHTML="<p style='text-align:center;color:#ff6b6b'>Firestore Database abhi bana nahi. Firebase me ja ke Firestore Database > Create Database > Test mode kar do.</p>"; }
}
async function checkLogin(){
  let saved = localStorage.getItem("yaarii_user");
  if(saved){
    let snap = await getDoc(doc(db,"users",saved));
    if(snap.exists()){ currentUser=saved; currentProfile=snap.data(); showLoggedIn(); return; }
  }
  loadPosts();
}
checkLogin();
window.loadPosts=loadPosts;
</script>
</body>
</html>
