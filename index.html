<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>YAARII-PK</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:Arial;padding-bottom:90px}
header{background:#000;padding:12px;text-align:center;border-bottom:2px solid #d4af37}
header h1{margin:0;color:#ffd700}
.card{background:#111;border:1px solid #333;border-radius:14px;padding:12px;margin:9px auto;max-width:520px}
input{width:100%;padding:11px;margin:6px 0;border-radius:11px;border:none;background:#222;color:#fff;box-sizing:border-box}
button{padding:11px 14px;border:none;border-radius:20px;background:#ffd700;color:#000;font-weight:700;cursor:pointer}
button.g{background:#222;color:#ffd700;border:1px solid #ffd700}
.hid{display:none}
.sm{color:#aaa;font-size:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#111;border-top:2px solid #d4af37;display:flex;padding:8px;z-index:30}
.bottom div{flex:1;text-align:center;color:#ffd700;cursor:pointer}
</style>
</head>
<body>
<header><h1>YAARII-PK</h1><p>Apni Mehfil - Apni Yaari</p></header>

<div id="auth">
<div class="card" style="text-align:center">
<h2 style="color:#ffd700">Account Banao</h2>
<input id="un" placeholder="Naam - jaise Leader">
<input id="pw" type="password" placeholder="Password">
<label><input type="checkbox" id="ag" style="width:auto"> Rules se agree hun</label><br>
<button onclick="signup()" style="width:100%;margin-top:8px">Signup</button>
<button class="g" onclick="login()" style="width:100%;margin-top:6px">Login</button>
<p id="am" style="color:#ff6666"></p>
</div>
</div>

<div id="main" class="hid">
<div class="card">
<b id="mn"></b> <span id="mid" class="sm"></span><br>
<span class="sm">Points: <b id="mpt" style="color:#ffd700">0</b></span><br>
<span id="mbio" class="sm"></span><br><br>
<input id="bio" placeholder="Apni Bio likho...">
<button onclick="upd()">Profile Update</button>
<button class="g" onclick="logout()">Logout</button>
</div>
<div class="card">
<input id="pt" placeholder="Kuch likho...">
<button onclick="addPost()" style="width:100%">Post Karo +10 Points</button>
</div>
<div id="posts" style="max-width:520px;margin:auto"></div>
</div>

<div class="bottom">
<div onclick="goHome()">HOME</div>
<div onclick="focusP()">SHARE</div>
<div onclick="logout()">LOGOUT</div>
</div>

<script>
var U = null;
var P = null;
var users = {};
var posts = {};
function load() {
  try {
    users = JSON.parse(localStorage.getItem("y_users") || "{}");
    posts = JSON.parse(localStorage.getItem("y_posts") || "{}");
  } catch(e) {}
}
function save() {
  localStorage.setItem("y_users", JSON.stringify(users));
  localStorage.setItem("y_posts", JSON.stringify(posts));
}
function signup() {
  var u = document.getElementById("un").value.trim();
  var p = document.getElementById("pw").value.trim();
  if (!u || !p) {
    document.getElementById("am").innerText = "Naam aur Password likho";
    return;
  }
  if (!document.getElementById("ag").checked) {
    document.getElementById("am").innerText = "Pehle Rules se agree karo";
    return;
  }
  load();
  if (users[u]) {
    document.getElementById("am").innerText = "Ye naam pehle se hai, Login karo";
    return;
  }
  users[u] = { username: u, password: p, bio: "", points: 50, id: Math.floor(10000 + Math.random() * 89999) };
  save();
  U = u;
  P = users[u];
  localStorage.setItem("y_login", u);
  showMain();
}
function login() {
  var u = document.getElementById("un").value.trim();
  var p = document.getElementById("pw").value.trim();
  load();
  if (!users[u]) {
    document.getElementById("am").innerText = "Account nahi mila, Signup karo";
    return;
  }
  if (users[u].password !== p) {
    document.getElementById("am").innerText = "Password galat hai";
    return;
  }
  U = u;
  P = users[u];
  localStorage.setItem("y_login", u);
  showMain();
}
function logout() {
  localStorage.removeItem("y_login");
  location.reload();
}
function showMain() {
  document.getElementById("auth").classList.add("hid");
  document.getElementById("main").classList.remove("hid");
  document.getElementById("mn").innerText = P.username;
  document.getElementById("mid").innerText = "(" + P.id + ")";
  document.getElementById("mpt").innerText = P.points;
  document.getElementById("mbio").innerText = P.bio || "";
  renderPosts();
}
function upd() {
  users[U].bio = document.getElementById("bio").value;
  save();
  alert("Profile update ho gaya!");
  location.reload();
}
function addPost() {
  var t = document.getElementById("pt").value.trim();
  if (!t) { alert("Kuch likho"); return; }
  var id = "p" + Date.now();
  posts[id] = { text: t, username: U, likes: 0, time: Date.now() };
  users[U].points = users[U].points + 10;
  P = users[U];
  save();
  document.getElementById("pt").value = "";
  document.getElementById("mpt").innerText = P.points;
  renderPosts();
}
function like(id) {
  posts[id].likes = posts[id].likes + 1;
  save();
  renderPosts();
}
function renderPosts() {
  var keys = Object.keys(posts);
  keys.sort(function(a,b){ return posts[b].time - posts[a].time; });
  var h = "";
  for (var i = 0; i < keys.length; i++) {
    var id = keys[i];
    var p = posts[id];
    h = h + '<div class="card"><b>' + p.username + '</b><p>' + p.text + '</p><button onclick="like(\'' + id + '\')">REACT ' + p.likes + '</button></div>';
  }
  if (h === "") { h = "<div class='card'>Abhi koi post nahi</div>"; }
  document.getElementById("posts").innerHTML = h;
}
function goHome() { window.scrollTo(0,0); }
function focusP() { document.getElementById("pt").focus(); }
load();
var sv = localStorage.getItem("y_login");
if (sv && users[sv]) { U = sv; P = users[sv]; showMain(); }
renderPosts();
</script>
</body>
</html>
