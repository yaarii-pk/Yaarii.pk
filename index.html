<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yaarii-PK - Apni Mehfil</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial}
header{background:#111;border-bottom:2px solid #d4af37;padding:15px;text-align:center;position:sticky;top:0;z-index:10}
header h1{margin:0;color:#d4af37;font-size:28px;letter-spacing:2px}
header p{margin:2px;color:#aaa;font-size:13px}
nav{display:flex;gap:5px;padding:10px;background:#111;overflow-x:auto}
nav button{background:#1a1a1a;color:#d4af37;border:1px solid #d4af37;padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}
nav button.active{background:#d4af37;color:#000}
.container{max-width:600px;margin:auto;padding:12px}
.card{background:#111;border:1px solid #333;border-radius:14px;padding:14px;margin-bottom:14px}
input,textarea,select{width:100%;background:#000;color:#fff;border:1px solid #444;padding:11px;border-radius:10px;margin-top:8px}
button.main{background:#d4af37;color:#000;border:none;padding:11px;border-radius:10px;font-weight:bold;cursor:pointer;width:100%;margin-top:8px}
.small{font-size:12px;color:#aaa}
.post-img{width:100%;border-radius:10px;margin-top:10px;max-height:400px;object-fit:cover}
.badge{color:#d4af37;font-weight:bold}
.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid #d4af37}
.flex{display:flex;gap:10px;align-items:center}
.like{cursor:pointer;color:#d4af37}
.hidden{display:none}
.pass-wrap{position:relative}
.eye{position:absolute;right:10px;top:18px;cursor:pointer;font-size:20px;z-index:2}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
</head>
<body>
<header><h1>👑 YAARII-PK</h1><p>Apni Mehfil - Apni Yaari</p></header>
<nav>
<button onclick="filterTopic('All',this)" class="active">All</button>
<button onclick="filterTopic('Poetry',this)">Poetry</button>
<button onclick="filterTopic('Funny Jokes',this)">Funny Jokes</button>
<button onclick="filterTopic('Sad Poetry',this)">Sad Poetry</button>
<button onclick="filterTopic('Mehfil',this)">Mehfil</button>
<button onclick="showProfile()">My Profile</button>
</nav>
<div class="container">
<div class="card">
<h3 style="color:#d4af37;margin:0">Login / Signup</h3>
<input id="username" placeholder="Username likho - jaise Leader NM">
<div class="pass-wrap"><input id="password" type="password" placeholder="Password likho"><span class="eye" onclick="togglePass()">👁️</span></div>
<button class="main" onclick="signup()">Signup Karo</button>
<button class="main" style="background:#222;color:#d4af37;border:1px solid #d4af37" onclick="login()">Login Karo</button>
<button class="main" style="background:#222;color:#fff" onclick="logout()">Logout</button>
<p class="small" id="authMsg">Status: Ready...</p>
</div>
<div class="card hidden" id="profileCard">
<h3 style="color:#d4af37;margin:0">Profile Update</h3>
<div class="flex"><img id="myPic" class="avatar" src="https://via.placeholder.com/100"><div><b id="myName">Guest</b><br><span class="small" id="myBioShow"></span></div></div>
<input id="bio" placeholder="Bio likho...">
<input id="picUrl" placeholder="Profile Pic Link">
<button class="main" onclick="updateProfile()">Profile Save Karo</button>
</div>
<div class="card">
<h3 style="color:#d4af37;margin:0">✍️ Nayi Post</h3>
<select id="topic"><option>Poetry</option><option>Funny Jokes</option><option>Sad Poetry</option><option>Mehfil</option></select>
<textarea id="postText" placeholder="Apni poetry / joke likho..."></textarea>
<input id="postImg" placeholder="Pic ka Link (optional)">
<button class="main" onclick="addPost()">Post Karo</button>
</div>
<div id="posts"></div>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyDK8_8TXQE5IJ6dVfm3_yFd99IpxbfidRk",
  authDomain: "yaari-pk.firebaseapp.com",
  databaseURL: "https://yaari-pk-default-rtdb.firebaseio.com",
  projectId: "yaari-pk",
  storageBucket: "yaari-pk.firebasestorage.app",
  messagingSenderId: "1043598133610",
  appId: "1:1043598133610:web:c5e2b5953d76d2601dbd13",
  measurementId: "G-8HLV166GGR"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.database();
var currentUser=null, currentProfile=null, currentFilter='All', allPosts={};

function togglePass(){ var p=document.getElementById('password'); p.type=p.type==='password'?'text':'password'; }

function signup(){
  document.getElementById('authMsg').innerText="Signup dab gaya... wait karo...";
  var u=document.getElementById('username').value.trim();
  var p=document.getElementById('password').value.trim();
  if(!u||!p){ document.getElementById('authMsg').innerText="Username aur Password dono likho"; return; }
  var id=u.toLowerCase().replace(/\s+/g,'_');
  db.ref('users/'+id).get().then(function(snap){
    if(snap.exists()){ document.getElementById('authMsg').innerText="Ye username pehle se hai"; return; }
    var isAdmin=(u==="Leader NM");
    var data={username:u,password:p,bio:"",pic:"",isAdmin:isAdmin};
    db.ref('users/'+id).set(data).then(function(){
      currentUser=id; currentProfile=data;
      localStorage.setItem("yaarii_login",id);
      document.getElementById('authMsg').innerText="Signup ho gaya! Welcome "+u+" 👑";
      showLoggedIn();
    });
  }).catch(function(e){ document.getElementById('authMsg').innerText="Error: "+e.message; });
}
function login(){
  document.getElementById('authMsg').innerText="Login dab gaya... wait karo...";
  var u=document.getElementById('username').value.trim();
  var p=document.getElementById('password').value.trim();
  if(!u||!p){ document.getElementById('authMsg').innerText="Username aur Password likho"; return; }
  var id=u.toLowerCase().replace(/\s+/g,'_');
  db.ref('users/'+id).get().then(function(snap){
    if(!snap.exists()){ document.getElementById('authMsg').innerText="Account nahi mila, pehle Signup karo"; return; }
    var data=snap.val();
    if(data.password!==p){ document.getElementById('authMsg').innerText="Password galat hai"; return; }
    currentUser=id; currentProfile=data;
    localStorage.setItem("yaarii_login",id);
    document.getElementById('authMsg').innerText="Welcome back "+data.username+"!";
    showLoggedIn();
  }).catch(function(e){ document.getElementById('authMsg').innerText="Error: "+e.message; });
}
function logout(){ localStorage.removeItem("yaarii_login"); location.reload(); }
function showLoggedIn(){
  if(!currentProfile) return;
  document.getElementById('profileCard').classList.remove('hidden');
  document.getElementById('myName').innerHTML=currentProfile.username+(currentProfile.isAdmin?' 👑 <span class="badge">LEADER</span>':'');
  document.getElementById('myBioShow').innerText=currentProfile.bio||"";
  if(currentProfile.pic) document.getElementById('myPic').src=currentProfile.pic;
  renderPosts();
}
function updateProfile(){
  if(!currentUser) return alert("Pehle login karo");
  db.ref('users/'+currentUser).update({bio:document.getElementById('bio').value,pic:document.getElementById('picUrl').value}).then(function(){ alert("Profile update ho gaya!"); location.reload(); });
}
function addPost(){
  if(!currentUser) return alert("Pehle login karo jani");
  if(!document.getElementById('postText').value.trim()) return alert("Kuch likho to sahi");
  db.ref('posts').push({text:document.getElementById('postText').value,img:document.getElementById('postImg').value,topic:document.getElementById('topic').value,username:currentProfile.username,pic:currentProfile.pic||"",isAdmin:currentProfile.isAdmin||false,likes:0,time:Date.now()});
  document.getElementById('postText').value=""; document.getElementById('postImg').value="";
}
function filterTopic(t,btn){ currentFilter=t; document.querySelectorAll('nav button').forEach(function(b){b.classList.remove('active')}); if(btn) btn.classList.add('active'); renderPosts(); }
function showProfile(){ document.getElementById('profileCard').classList.remove('hidden'); window.scrollTo(0,0); }
function likePost(id){ var cur=(allPosts[id]&&allPosts[id].likes)||0; db.ref('posts/'+id).update({likes:cur+1}); }
function deletePost(id){
  if(!currentProfile||!currentProfile.isAdmin) return alert("Sirf Admin delete kar sakta hai");
  if(confirm("Delete kar dun?")) db.ref('posts/'+id).remove();
}
function renderPosts(){
  var list=Object.entries(allPosts).sort(function(a,b){ return (b[1].time||0)-(a[1].time||0) });
  var html="";
  list.forEach(function(item){
    var id=item[0]; var p=item[1];
    if(currentFilter!=='All' && p.topic!==currentFilter) return;
    var crown=p.isAdmin?' 👑 <span class="badge">LEADER • ADMIN</span>':'';
    var delBtn=(currentProfile&&currentProfile.isAdmin)?'<button onclick="deletePost(\''+id+'\')" style="background:red;color:#fff;border:none;padding:5px 10px;border-radius:8px;margin-top:8px">Delete (Admin)</button>':'';
    html+='<div class="card"><div class="flex"><img class="avatar" src="'+(p.pic||'https://via.placeholder.com/100')+'"><div><b>'+p.username+'</b>'+crown+'<br><span class="small">'+p.topic+'</span></div></div><p>'+p.text+'</p>'+(p.img?'<img class="post-img" src="'+p.img+'">':'')+'<div style="margin-top:10px"><span class="like" onclick="likePost(\''+id+'\')">❤️ '+(p.likes||0)+' Like</span></div>'+delBtn+'</div>';
  });
  document.getElementById('posts').innerHTML=html||"<p style='text-align:center;color:#888'>Abhi koi post nahi, pehli post tum karo!</p>";
}
db.ref('posts').on('value', function(snap){ allPosts=snap.val()||{}; renderPosts(); });
var saved=localStorage.getItem("yaarii_login");
if(saved){ db.ref('users/'+saved).get().then(function(snap){ if(snap.exists()){ currentUser=saved; currentProfile=snap.val(); showLoggedIn(); } }); }
</script>
</body>
</html>
